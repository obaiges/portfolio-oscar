<div class="flex flex-col gap-1.5 group">
    <div class="flex justify-between items-start gap-2">
        <div class="flex flex-col min-w-0">
            <span class="font-semibold text-sm transition-colors group-hover:text-[var(--primary-color)] truncate">{{name}}</span>
        </div>
        <span
            class="text-[11px] font-mono bg-[var(--primary-color-10)] text-[var(--primary-color)] px-2 py-0.5 rounded-md font-semibold shrink-0">{{score}}%</span>
    </div>
    <div class="h-1.5 w-full bg-slate-200 dark:bg-slate-700 rounded-full overflow-hidden">
        <div class="h-full bg-gradient-to-r from-[var(--primary-color)] to-[var(--primary-color-50)] rounded-full transition-all duration-1000 ease-out"
            [style.width.%]="animatedScore"></div>
    </div>
</div>
